services:
  app:
    build: .
    container_name: ormvasm-ao-marches
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: ormvasm_ao_marches
      PORT: 3000
      SESSION_SECRET: change_this_secret_en_production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: gestion-ao-marches-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ormvasm_ao_marches
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/referentiels_seed.sql:/docker-entrypoint-initdb.d/02-referentiels.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: